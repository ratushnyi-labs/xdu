# Lawbook §8.2: all builds and tests run inside containers.
# Lawbook §8.1: ports configurable via .env. (xdu has no exposed ports.)

services:

  # Cross-compile + extract binary for ${TARGET}.
  # Supported TARGET values (6-target matrix):
  #   x86_64-unknown-linux-musl    (native)
  #   aarch64-unknown-linux-musl   (native)
  #   x86_64-pc-windows-msvc       (via cargo-xwin)
  #   aarch64-pc-windows-msvc      (via cargo-xwin)
  #   x86_64-apple-darwin          (via cargo-zigbuild)
  #   aarch64-apple-darwin         (via cargo-zigbuild)
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        TARGET: ${TARGET:-x86_64-unknown-linux-musl}
    environment:
      TARGET: ${TARGET:-x86_64-unknown-linux-musl}
    volumes:
      - ./dist:/out_host
    command:
      - sh
      - -c
      - |
        set -eu
        case "$$TARGET" in *windows*) ext=.exe ;; *) ext= ;; esac
        mkdir -p "/out_host/$$TARGET"
        cp "/dist/$$TARGET/xdu$$ext" "/out_host/$$TARGET/"
        ls -la "/out_host/$$TARGET/"

  # Canonical test / dev runner — used by scripts/ci.sh and the CI workflow
  # for fmt / clippy / check / test. Source is mounted; cargo cache lives in a
  # named volume.
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    working_dir: /src
    volumes:
      - .:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    command: ["sh"]

volumes:
  cargo-registry:
  cargo-target:
