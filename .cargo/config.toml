# Per-target linker selection.
# Rationale: with zero C dependencies and panic=abort, rust-lld is sufficient
# for both musl Linux targets. windows-gnu still needs mingw-w64 for the C
# runtime stubs Rust's std references.

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
