# Per-target linker selection.
# Rationale: with zero C dependencies and panic=abort, rust-lld is sufficient
# for both musl Linux targets.
#
# Windows MSVC targets are driven via `cargo xwin build` (see Dockerfile), which
# injects its own linker/ar/cc environment derived from the splatted SDK at
# /xwin — no explicit entries needed here.
#
# Apple-darwin targets are driven via `cargo zigbuild`, which uses Zig's
# bundled linker and macOS sysroot stubs — again, no explicit entries needed.

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
