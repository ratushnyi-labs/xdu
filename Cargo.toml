[package]
name = "xdu"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Pavlo Ratushnyi"]
license = "MIT"
description = "Read-only disk-usage explorer with terminal UI"
readme = "README.md"
repository = "https://github.com/ratushnyi-labs/xdu"
homepage = "https://github.com/ratushnyi-labs/xdu"
keywords = ["disk-usage", "tui", "cli", "filesystem", "ncdu"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "xdu"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
